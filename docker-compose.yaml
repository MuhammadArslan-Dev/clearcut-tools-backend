# Coolify Docker Compose resource for clearcut-tools.
#
# Set the Coolify app's docker_compose_location to /docker-compose.yaml.
# Values come from the Coolify environment UI and are interpolated below;
# keep the key list in sync with the app's env vars.
#
# Only `web` gets a domain (tools-api.clearcutoff.in, port 80) in Coolify.
# `worker` has no domain and no HTTP health check.

x-app: &app
  build:
    context: .
    args:
      VITE_APP_NAME: ${VITE_APP_NAME:-ClearCutoff Tools}
  image: clearcut-tools:${APP_IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: &app-env
    APP_ENV: ${APP_ENV:-production}
    APP_NAME: ${APP_NAME:-}
    APP_KEY: ${APP_KEY:?APP_KEY must be set in Coolify}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-}
    APP_LOCALE: ${APP_LOCALE:-en}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
    APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
    BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    LOG_STACK: ${LOG_STACK:-single}
    LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
    LOG_LEVEL: ${LOG_LEVEL:-error}
    DB_CONNECTION: ${DB_CONNECTION:-pgsql}
    DB_HOST: ${DB_HOST:-}
    DB_PORT: ${DB_PORT:-5432}
    DB_DATABASE: ${DB_DATABASE:-}
    DB_USERNAME: ${DB_USERNAME:-}
    DB_PASSWORD: ${DB_PASSWORD:-}
    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
    SESSION_PATH: ${SESSION_PATH:-/}
    SESSION_DOMAIN: ${SESSION_DOMAIN:-}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    CACHE_STORE: ${CACHE_STORE:-database}
    MEMCACHED_HOST: ${MEMCACHED_HOST:-}
    REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
    REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    REDIS_PORT: ${REDIS_PORT:-6379}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    AWS_BUCKET: ${AWS_BUCKET:-}
    AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    BIGQUERY_PROJECT_ID: ${BIGQUERY_PROJECT_ID:-}
    # Path relative to the project root (see BigQueryClient::__construct).
    # The JSON key itself is mounted into the container, never committed.
    BIGQUERY_CREDENTIALS: ${BIGQUERY_CREDENTIALS:-storage/app/google-bigquery-access-key.json}

services:
  web:
    <<: *app
    expose:
      - "80"

  worker:
    <<: *app
    # Same image, different command. --tries must stay above 1: the sync job
    # uses WithoutOverlapping release-and-retry (see RunBigQuerySyncJob).
    command: ["php", "artisan", "queue:work", "--tries=5", "--backoff=10", "--sleep=3", "--timeout=3600"]
