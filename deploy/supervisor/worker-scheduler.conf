; Laravel scheduler. schedule:work is a long-running loop that runs due
; tasks every minute, so Supervisor can keep it alive (no host cron needed).
[program:worker-scheduler]
command=bash -c 'exec php /app/artisan schedule:work'
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=0
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
