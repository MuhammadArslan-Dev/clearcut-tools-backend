; Laravel queue worker (QUEUE_CONNECTION=database).
; numprocs controls how many parallel workers run; lower it to save memory.
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=0
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
