[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
; Log to the container's stdout so everything shows in Coolify's Logs tab.
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

; Every program in conf.d/ is started by this include.
[include]
files = /etc/supervisor/conf.d/*.conf
